<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Research visualization cover</title>
  <desc id="desc">Visualization-only research cover with diagram nodes and explanatory labels.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3fbff"/>
      <stop offset="0.52" stop-color="#edf8fd"/>
      <stop offset="1" stop-color="#dceff7"/>
    </linearGradient>
    <radialGradient id="wash" cx="72%" cy="35%" r="62%">
      <stop offset="0" stop-color="#48d5e8" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#d9f4fb" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f3fbff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#bad0df" stroke-width="1" opacity="0.32"/>
    </pattern>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#123047" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#0f5ea8"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#paper)"/>
  <rect width="1600" height="1000" fill="url(#wash)"/>
  <rect width="1600" height="1000" fill="url(#grid)" opacity="0.52"/>
  <rect x="54" y="54" width="1492" height="892" rx="42" fill="none" stroke="#bad0df" stroke-width="2"/>
