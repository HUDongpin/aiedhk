<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Research visualization cover</title>
  <desc id="desc">Visualization-only research cover with tutor feedback nodes and review signals.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6fbff"/>
      <stop offset="0.55" stop-color="#edf8fd"/>
      <stop offset="1" stop-color="#dbeefa"/>
    </linearGradient>
    <radialGradient id="wash" cx="70%" cy="32%" r="62%">
      <stop offset="0" stop-color="#48d5e8" stop-opacity="0.26"/>
      <stop offset="0.48" stop-color="#d9f4fb" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f6fbff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#bad0df" stroke-width="1" opacity="0.32"/>
    </pattern>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#123047" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#0f5ea8"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#paper)"/>
  <rect width="1600" height="1000" fill="url(#wash)"/>
  <rect width="1600" height="1000" fill="url(#grid)" opacity="0.52"/>
  <rect x="54" y="54" width="1492" height="892" rx="42" fill="none" stroke="#bad0df" stroke-width="2"/>
  <g id="research-visualization-poster" transform="translate(170 44) scale(0.87)">
    <g class="science-editorial-figure" data-style="editorial-science" data-kind="feedback">
      <rect x="116" y="92" width="1368" height="820" rx="44" fill="#ecf9fb" stroke="#bad0df" stroke-width="2"/>
      <path d="M152 144H1448M152 736H1448" stroke="#ffffff" stroke-width="1.5" opacity="0.68"/>
      <rect data-role="figure-panel" x="150" y="126" width="1300" height="720" rx="28" fill="#ffffff" opacity="0.58" filter="url(#paperShadow)"/>
      <rect x="150" y="126" width="1300" height="720" rx="28" fill="none" stroke="#bad0df" stroke-width="1.5" opacity="0.86"/>
      <g data-role="grid">
        <path d="M176 152V820M280 152V820M384 152V820M488 152V820M592 152V820M696 152V820M800 152V820M904 152V820M1008 152V820M1112 152V820M1216 152V820M1320 152V820M1424 152V820" stroke="#bad0df" stroke-width="1" opacity="0.24"/>
        <path d="M176 152H1424M176 256H1424M176 360H1424M176 464H1424M176 568H1424M176 672H1424M176 776H1424" stroke="#bad0df" stroke-width="1" opacity="0.24"/>
      </g>
      <g data-role="primary-visual" transform="translate(-400 -300) scale(1.58)">
        <path d="M248 466C330 330 506 286 640 374C732 434 742 542 824 594C910 648 1038 618 1116 520" fill="none" stroke="#0f5ea8" stroke-width="14" stroke-linecap="round" opacity="0.18"/>
        <path d="M334 612L512 442L696 612L878 416L1054 566" fill="none" stroke="#0f5ea8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
        <circle cx="512" cy="442" r="86" fill="#123047"/>
        <text x="512" y="434" text-anchor="middle" fill="#d9f4fb" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="920">student</text>
        <text x="512" y="466" text-anchor="middle" fill="#d9f4fb" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="920">error</text>
        <circle cx="696" cy="612" r="92" fill="#48d5e8"/>
        <text x="696" y="604" text-anchor="middle" fill="#123047" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="950">targeted</text>
        <text x="696" y="636" text-anchor="middle" fill="#123047" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="950">hint</text>
        <circle cx="878" cy="416" r="82" fill="#123047"/>
        <text x="878" y="408" text-anchor="middle" fill="#d9f4fb" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="920">tutor</text>
        <text x="878" y="439" text-anchor="middle" fill="#d9f4fb" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="920">context</text>
        <circle cx="1054" cy="566" r="86" fill="#d9f4fb" stroke="#0f5ea8" stroke-width="4"/>
        <text x="1054" y="558" text-anchor="middle" fill="#123047" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="920">quality</text>
        <text x="1054" y="589" text-anchor="middle" fill="#123047" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="920">review</text>
        <rect x="350" y="696" width="164" height="48" rx="16" fill="#ffffff" stroke="#bad0df" stroke-width="1.5"/>
        <circle cx="376" cy="720" r="7" fill="#48d5e8"/>
        <text x="398" y="728" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="820">diagnosis</text>
        <rect x="552" y="744" width="160" height="48" rx="16" fill="#ffffff" stroke="#bad0df" stroke-width="1.5"/>
        <circle cx="578" cy="768" r="7" fill="#48d5e8"/>
        <text x="600" y="776" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="820">feedback</text>
        <rect x="754" y="706" width="150" height="48" rx="16" fill="#ffffff" stroke="#bad0df" stroke-width="1.5"/>
        <circle cx="780" cy="730" r="7" fill="#48d5e8"/>
        <text x="802" y="738" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="820">withhold</text>
      </g>
    </g>
  </g>
</svg>
