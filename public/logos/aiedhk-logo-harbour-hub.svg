      <stop offset="1" stop-color="#48d5e8"/>
    </linearGradient>
    <filter id="harbourHubShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
