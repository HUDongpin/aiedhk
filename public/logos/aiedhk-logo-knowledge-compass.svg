  <text x="238" y="100" fill="#0f172a" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="850" letter-spacing="-2">AIEDHK</text>
  <text x="240" y="154" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="31" font-weight="520">AI in Education Hub of Knowledge</text>
