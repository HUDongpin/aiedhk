    <circle cx="78" cy="73" r="5.5" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="42" cy="73" r="4" fill="#48d5e8" stroke="none"/>
    <circle cx="114" cy="73" r="4" fill="#48d5e8" stroke="none"/>
